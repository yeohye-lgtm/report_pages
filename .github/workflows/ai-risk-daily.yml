name: AI Risk Daily Report

on:
  workflow_dispatch:
  schedule:
    - cron: "10 23 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-risk-pages
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai
      - name: Generate AI risk report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_report.py
      - name: Validate generated artifacts
        run: |
          python -c "import json; from pathlib import Path; r=Path('public/ai-risk'); d=json.loads((r/'latest.json').read_text(encoding='utf-8')); assert all(x in d for x in ('trend','current_level_streak_days','history_count','monthly_summary')); day=d['date']; paths=[r/'latest.html',r/'archive'/day[:4]/day[5:7]/(day+'.json'),r/'archive'/day[:4]/day[5:7]/(day+'.html'),r/'summary'/'monthly'/(day[:7]+'.json'),r/'summary'/'monthly'/(day[:7]+'.html')]; assert all(p.exists() for p in paths), paths"
      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ai-risk
          if git diff --cached --quiet; then echo "No report changes to commit."; else git commit -m "daily: update AI risk report"; git push; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
