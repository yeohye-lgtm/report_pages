name: AI Risk Daily Report

on:
  # GitHub 화면에서 수동 실행할 수 있게 함
  workflow_dispatch:

  # 매일 한국시간 오전 8:10 실행
  # GitHub Actions cron은 UTC 기준
  # 23:10 UTC = 다음날 08:10 KST
  schedule:
    - cron: "10 23 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-risk-pages
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 설치
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 필요한 Python 패키지 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai

      # 4. AI 투자리스크 리포트 생성
      - name: Generate AI risk report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python generate_report.py

      # 5. 생성된 HTML / JSON을 저장소에 기록
      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/ai-risk

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "daily: update AI risk report"
            git push
          fi

      # 6. GitHub Pages 설정
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 7. public 폴더를 Pages 배포용 artifact로 업로드
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 8. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
