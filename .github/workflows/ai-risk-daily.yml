name: AI Risk Daily Report

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 'Research current data (uses OpenAI API). False only re-renders stored data.'
        type: boolean
        default: true
  schedule:
    - cron: '10 23 * * *' # 08:10 Asia/Seoul; GitHub may queue scheduled runs.
  push:
    branches: [main, 'fix/approved-risk-layout-20260928']
    paths: ['*.py', 'prompt.txt', 'templates/**', 'tests/**', '.github/workflows/ai-risk-daily.yml']

permissions:
  contents: read

concurrency:
  group: ai-risk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and browser checks
        run: |
          python -m pip install 'openai>=1.68,<3' 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Syntax and unit tests
        run: |
          python -m py_compile generate_report.py report_ui.py report_schema.py history_utils.py
          python -m unittest discover -s tests -v
      - name: Research daily data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python generate_report.py
      - name: Re-render stored report without API usage
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.refresh_data)
        run: python generate_report.py --render-only
      - name: Mobile layout and interaction checks
        run: python tests/check_browser.py
      - name: Keep test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-ui-checks-${{ github.run_id }}
          path: test-artifacts
          retention-days: 14
          if-no-files-found: ignore
      - name: Commit generated reports on main only
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ai-risk public/.nojekyll
          if git diff --cached --quiet; then
            echo 'No output changes'
          else
            git commit -m 'daily: render approved risk UI and versioned history'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Verify public HTML and JSON build
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tests/verify_pages.py
