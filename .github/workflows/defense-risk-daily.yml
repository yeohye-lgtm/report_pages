name: Defense Risk Daily Report
on:
  workflow_dispatch:
  schedule:
    - cron: '25 23 * * *'
permissions:
  contents: write
  pages: read
concurrency:
  group: defense-risk-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'openai>=1.68,<3'
      - run: python -m py_compile defense_generate.py defense_report_schema.py
      - name: Research and render
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python defense_generate.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/defense-risk public/.nojekyll
          git diff --cached --quiet || (git commit -m 'daily: update defense risk report' && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify defense latest
        run: |
          python - <<'PY'
          import urllib.request
          base='${{ steps.deployment.outputs.page_url }}'.rstrip('/')
          for p in ('defense-risk/latest.html','defense-risk/latest.json','defense-risk/status.json'):
              with urllib.request.urlopen(base+'/'+p,timeout=30) as r:
                  assert r.status==200 and len(r.read())>20, p
          print('DEFENSE PAGES VERIFIED')
          PY
