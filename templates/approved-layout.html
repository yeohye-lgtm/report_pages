<!DOCTYPE html>

<html data-content-mode="@@CONTENT_MODE@@" data-layout="approved-redesign-2026-09-27" data-layout-revision="2.0.0" lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="dark" name="color-scheme"/><meta content="AI 산업 위험을 오늘, 추세, 근거로 구분한 상황판" name="description"/><title>AI 투자리스크 센싱 · @@DATE@@</title><style>@@APPROVED_CSS@@</style><meta content="2.0.0" name="ai-risk-ui-version"/><style>
.hero{--active:var(--orange)}.hero[data-tone=yellow]{--active:var(--yellow);border-color:#5d532c;background:linear-gradient(150deg,#211f16,#15171d 85%)}.hero[data-tone=green]{--active:var(--green);border-color:#315649;background:linear-gradient(150deg,#14221c,#15171d 85%)}.hero[data-tone=red]{--active:var(--red);border-color:#71404a;background:linear-gradient(150deg,#2a181d,#15171d 85%)}.hero[data-tone=gray]{--active:var(--muted);border-color:var(--line);background:var(--surface)}.hero .hero-state h2,.hero .en-level{color:var(--active)}.stage[data-active=true] .stage-track::after{background:var(--stage)}.stage[data-active=true] .stage-name{color:var(--stage)}.changes{align-items:flex-start}.value-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.value-row strong{max-width:65%;text-align:right}.changes strong{overflow-wrap:anywhere}.refchip{min-height:44px}.axis-tail{max-width:32%}.state{white-space:normal}.sheet-content{overflow-wrap:anywhere}
</style><meta name="report-build" content="@@BUILD_SHA@@"/></head><body>
<div class="app">
<div class="sample-strip"><b>AI 산업 상황판</b><button data-sheet="about" type="button">@@STRIP_NOTE@@</button></div>
<header class="main-header"><div class="branding"><span class="brand-symbol"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><rect height="12" rx="2" width="12" x="6" y="6"></rect><path d="M9 3v3m6-3v3M9 18v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3"></path><rect height="6" rx="1" width="6" x="9" y="9"></rect></svg></span><h1>AI 투자리스크 센싱</h1></div><div class="report-date"><strong>@@SHORT_DATE@@</strong>@@YEAR@@ 기준</div></header>
<main>
<section aria-labelledby="tab-today" class="panel" id="panel-today" role="tabpanel">
<div class="hero" data-tone="@@TONE@@">
<div class="hero-kicker"><span>@@KICKER@@</span><span class="delta">@@DELTA@@</span></div>
<div class="hero-state"><h2>@@LEVEL_KO@@</h2><span class="en-level">@@LEVEL@@</span></div>
<p class="hero-headline">@@HEADLINE@@</p>
<p class="hero-sub">@@REASON@@</p>
<ol aria-label="4단계 위험 분류" class="spectrum">@@SPECTRUM@@</ol>
<button aria-haspopup="dialog" class="why-button" data-sheet="method" type="button"><span><strong>판정 근거는?</strong><small>규칙 · 반대 근거 보기</small></span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
<div class="changes"><span aria-hidden="true" class="neutral-dot"></span><span class="label">오늘 변화</span><strong>@@CHANGES@@</strong></div>
<div class="section-header"><h2>어디를 봐야 하나요?</h2><span>눌러서 근거 확인</span></div>
<div class="axes"><button aria-haspopup="dialog" aria-label="@@FUNDING_ARIA@@" class="axis-row" data-change="@@FUNDING_CHANGE@@" data-sheet="funding" type="button">
<span class="axis-icon @@FUNDING_TONE@@"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><path d="M3 9l9-6 9 6H3zM5 10v8m7-8v8m7-8v8M3 21h18M3 18h18"></path></svg></span><span class="axis-copy"><strong>자금조달</strong><span>@@FUNDING_MEANING@@</span></span><span class="axis-tail"><span class="state @@FUNDING_TONE@@">@@FUNDING_STATUS@@</span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg></span>
</button>
<button aria-haspopup="dialog" aria-label="@@DEMAND_ARIA@@" class="axis-row" data-change="@@DEMAND_CHANGE@@" data-sheet="demand" type="button">
<span class="axis-icon @@DEMAND_TONE@@"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><path d="M4 18V6m0 12h16M7 14l4-4 4 2 5-7M16 5h4v4"></path></svg></span><span class="axis-copy"><strong>투자수요</strong><span>@@DEMAND_MEANING@@</span></span><span class="axis-tail"><span class="state @@DEMAND_TONE@@">@@DEMAND_STATUS@@</span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg></span>
</button>
<button aria-haspopup="dialog" aria-label="@@BORROWER_ARIA@@" class="axis-row" data-change="@@BORROWER_CHANGE@@" data-sheet="borrower" type="button">
<span class="axis-icon @@BORROWER_TONE@@"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><path d="M5 21V3h10v18m0-12h4v12M3 21h18M8 7h4M8 11h4M8 15h4M9 21v-3h3v3"></path></svg></span><span class="axis-copy"><strong>사업자 안정성</strong><span>@@BORROWER_MEANING@@</span></span><span class="axis-tail"><span class="state @@BORROWER_TONE@@">@@BORROWER_STATUS@@</span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg></span>
</button>
<button aria-haspopup="dialog" aria-label="@@GPU_ARIA@@" class="axis-row" data-change="@@GPU_CHANGE@@" data-sheet="gpu" type="button">
<span class="axis-icon @@GPU_TONE@@"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><rect height="12" rx="2" width="12" x="6" y="6"></rect><path d="M9 3v3m6-3v3M9 18v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3"></path><rect height="6" rx="1" width="6" x="9" y="9"></rect></svg></span><span class="axis-copy"><strong>GPU 경제성</strong><span>@@GPU_MEANING@@</span></span><span class="axis-tail"><span class="state @@GPU_TONE@@">@@GPU_STATUS@@</span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg></span>
</button>
<button aria-haspopup="dialog" aria-label="@@CONTAGION_ARIA@@" class="axis-row" data-change="@@CONTAGION_CHANGE@@" data-sheet="contagion" type="button">
<span class="axis-icon @@CONTAGION_TONE@@"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><circle cx="5" cy="12" r="3"></circle><circle cx="18" cy="5" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8 10.5l7-4m-7 7 7 4"></path></svg></span><span class="axis-copy"><strong>손실 전염</strong><span>@@CONTAGION_MEANING@@</span></span><span class="axis-tail"><span class="state @@CONTAGION_TONE@@">@@CONTAGION_STATUS@@</span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg></span>
</button></div>
<section class="next-watch"><button data-sheet="next" type="button"><span><span class="eyebrow">다음에 확인할 한 가지</span><h3>@@NEXT@@</h3></span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg></button></section>
<details class="investment"><summary>포트폴리오에서 참고할 점</summary><p>@@INVESTOR@@</p></details>
<p class="mini-footer">@@FOOTER@@</p>
</section>
<section aria-labelledby="tab-trend" class="panel" hidden="" id="panel-trend" role="tabpanel">@@TREND_HTML@@</section>
<section aria-labelledby="tab-evidence" class="panel" hidden="" id="panel-evidence" role="tabpanel">@@EVIDENCE_HTML@@</section>
</main>
</div>
<nav aria-label="리스크 리포트 탐색" class="bottom-tabs" role="tablist">
<button aria-controls="panel-today" aria-selected="true" class="tab" data-tab="today" id="tab-today" role="tab" type="button"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><rect height="7" rx="1.5" width="7" x="3" y="3"></rect><rect height="7" rx="1.5" width="7" x="14" y="3"></rect><rect height="7" rx="1.5" width="7" x="3" y="14"></rect><rect height="7" rx="1.5" width="7" x="14" y="14"></rect></svg><span>오늘</span></button>
<button aria-controls="panel-trend" aria-selected="false" class="tab" data-tab="trend" id="tab-trend" role="tab" tabindex="-1" type="button"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><path d="M4 4v16h17M7 15l4-5 4 2 5-7"></path></svg><span>추세</span></button>
<button aria-controls="panel-evidence" aria-selected="false" class="tab" data-tab="evidence" id="tab-evidence" role="tab" tabindex="-1" type="button"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8m-8 4h8"></path></svg><span>근거</span></button>
</nav>
<dialog aria-describedby="sheet-subtitle" aria-labelledby="sheet-title" class="sheet" id="detail-sheet">
<div class="sheet-shell"><header class="sheet-head"><div><h2 id="sheet-title"></h2><p id="sheet-subtitle"></p></div><button aria-label="상세 설명 닫기" class="sheet-close" type="button"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewBox="0 0 24 24"><path d="M6 6l12 12M6 18L18 6"></path></svg></button></header><div class="sheet-content" id="sheet-content"></div></div>
</dialog>
<noscript>상세 설명·탭 전환에는 JavaScript가 필요합니다.</noscript>
<script id="report-panels" type="application/json">@@PANELS_JSON@@</script><script>@@APPROVED_JS@@</script></body></html>
